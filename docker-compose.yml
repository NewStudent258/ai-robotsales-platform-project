services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: robot_sales
      MYSQL_USER: robot_sales
      MYSQL_PASSWORD: robot_sales
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  mysql_data:
