name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # 测试使用 SQLite 内存库；此处仅为满足配置默认值，不连接外部服务。
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      AUTO_CREATE_TABLES: "false"
      DEBUG: "true"
      ADMIN_API_TOKEN: test-admin-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format check (ruff format)
        run: python -m ruff format --check .

      - name: Verify migrations apply
        run: |
          rm -f ci_migrate.db
          DATABASE_URL="sqlite+aiosqlite:///./ci_migrate.db" python -m alembic upgrade head

      - name: Seed script runs
        run: |
          rm -f ci_seed.db
          DATABASE_URL="sqlite+aiosqlite:///./ci_seed.db" AUTO_CREATE_TABLES=true python scripts/seed_products.py

      - name: Tests
        run: python -m pytest -q
